name: Daily Slack Dashboard Report

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  send-slack-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-cloud-bigquery psycopg2-binary requests

      - name: Send Dashboard Report to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BIGQUERY_KEY_B64: ${{ secrets.BIGQUERY_KEY }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: |
          python3 << 'PYTHON_SCRIPT'
import os
import sys
import json
import base64
import requests
from datetime import datetime, timedelta

print("=== Starting Dashboard Report ===")

# 1. Slack Webhook URL 확인
slack_url = os.environ.get('SLACK_WEBHOOK_URL', '')
if not slack_url:
    print("ERROR: SLACK_WEBHOOK_URL not set")
    sys.exit(1)
print("Slack URL: OK")

# 2. BigQuery 설정
bq_key_b64 = os.environ.get('BIGQUERY_KEY_B64', '')
if not bq_key_b64:
    print("ERROR: BIGQUERY_KEY not set")
    sys.exit(1)

try:
    bq_key_json = base64.b64decode(bq_key_b64).decode('utf-8')
    with open('/tmp/bq-key.json', 'w') as f:
        f.write(bq_key_json)
    os.environ['GOOGLE_APPLICATION_CREDENTIALS'] = '/tmp/bq-key.json'
    print("BigQuery Key: Decoded OK")
except Exception as e:
    print(f"ERROR: BigQuery key decode failed: {e}")
    sys.exit(1)

# 3. BigQuery 클라이언트 초기화
try:
    from google.cloud import bigquery
    client = bigquery.Client()
    print("BigQuery Client: OK")
except Exception as e:
    print(f"ERROR: BigQuery client init failed: {e}")
    sys.exit(1)

# 4. 날짜 범위 설정
end_date = datetime.now()
start_date = end_date - timedelta(days=30)
start_str = start_date.strftime("%Y%m%d")
end_str = end_date.strftime("%Y%m%d")
start_dash = start_date.strftime("%Y-%m-%d")
end_dash = end_date.strftime("%Y-%m-%d")
print(f"Date Range: {start_dash} ~ {end_dash}")

# 5. 데이터 수집
data = {
    'mau': 0,
    'revenue': 0,
    'paying_users': 0,
    'arppu': 0,
    'conversion': 0,
    'cac': 0,
    'ltv_cac': 0,
    'roas': 0,
    'margin': 0
}

# MAU 쿼리
try:
    query = f"""
    SELECT COUNT(DISTINCT user_pseudo_id) as mau
    FROM `cheongimun.analytics_515600551.events_*`
    WHERE _TABLE_SUFFIX BETWEEN '{start_str}' AND '{end_str}'
    """
    for row in client.query(query).result():
        data['mau'] = row.mau or 0
    print(f"MAU: {data['mau']:,}")
except Exception as e:
    print(f"WARNING: MAU query failed: {e}")

# 매출 & 결제 유저 쿼리
try:
    query = f"""
    SELECT
        SUM(total_amount) as revenue,
        COUNT(DISTINCT customer_phone) as paying_users
    FROM `cheongimun.supabase_sync.orders`
    WHERE payment_status = 'PAID'
      AND DATE(created_at) BETWEEN '{start_dash}' AND '{end_dash}'
    """
    for row in client.query(query).result():
        data['revenue'] = int(row.revenue) if row.revenue else 0
        data['paying_users'] = row.paying_users or 0
    print(f"Revenue: {data['revenue']:,}")
    print(f"Paying Users: {data['paying_users']:,}")
except Exception as e:
    print(f"WARNING: Revenue query failed: {e}")

# 6. PostgreSQL (광고비, AI비용)
ad_spend = 52960184
ai_cost = 21754819

try:
    import psycopg2
    conn = psycopg2.connect(
        host='aws-1-ap-northeast-2.pooler.supabase.com',
        port=6543,
        database='postgres',
        user='postgres.jlutbjmjpreauyanjzdd',
        password=os.environ.get('SUPABASE_PASSWORD', ''),
        sslmode='require',
        connect_timeout=10
    )
    cur = conn.cursor()

    cur.execute("SELECT SUM(spend) FROM adset_performance")
    result = cur.fetchone()
    if result and result[0]:
        ad_spend = float(result[0])

    cur.execute("SELECT SUM(cost_krw) FROM api_costs")
    result = cur.fetchone()
    if result and result[0]:
        ai_cost = float(result[0])

    cur.close()
    conn.close()
    print(f"Ad Spend: {ad_spend:,}")
    print(f"AI Cost: {ai_cost:,}")
except Exception as e:
    print(f"WARNING: PostgreSQL failed, using defaults: {e}")

# 7. 파생 지표 계산
if data['revenue'] and data['paying_users']:
    data['arppu'] = round(data['revenue'] / data['paying_users'])

if data['mau'] and data['paying_users']:
    data['conversion'] = round(data['paying_users'] / data['mau'] * 100, 2)

if data['paying_users'] and ad_spend:
    data['cac'] = round(ad_spend / data['paying_users'])

if data['arppu'] and data['cac']:
    data['ltv_cac'] = round(data['arppu'] / data['cac'], 2)

if data['revenue'] and ad_spend:
    data['roas'] = round(data['revenue'] / ad_spend, 2)

if data['revenue'] and ai_cost:
    data['margin'] = round((1 - ai_cost / data['revenue']) * 100, 1)

print(f"Calculated Metrics: {data}")

# 8. Slack 메시지 전송
now_str = datetime.now().strftime('%Y-%m-%d %H:%M')

payload = {
    "blocks": [
        {
            "type": "header",
            "text": {
                "type": "plain_text",
                "text": "Investment Dashboard Daily Report",
                "emoji": True
            }
        },
        {
            "type": "context",
            "elements": [
                {
                    "type": "mrkdwn",
                    "text": f"*{now_str}* | Data: {start_dash} ~ {end_dash}"
                }
            ]
        },
        {"type": "divider"},
        {
            "type": "section",
            "fields": [
                {"type": "mrkdwn", "text": f"*Monthly Revenue*\nKRW {data['revenue']:,}"},
                {"type": "mrkdwn", "text": f"*MAU*\n{data['mau']:,}"},
                {"type": "mrkdwn", "text": f"*ARPPU*\nKRW {data['arppu']:,}"},
                {"type": "mrkdwn", "text": f"*Paying Users*\n{data['paying_users']:,}"}
            ]
        },
        {"type": "divider"},
        {
            "type": "section",
            "fields": [
                {"type": "mrkdwn", "text": f"*ROAS*\n{data['roas']}x"},
                {"type": "mrkdwn", "text": f"*LTV/CAC*\n{data['ltv_cac']}x"},
                {"type": "mrkdwn", "text": f"*Gross Margin*\n{data['margin']}%"},
                {"type": "mrkdwn", "text": f"*Conversion*\n{data['conversion']}%"}
            ]
        },
        {"type": "divider"},
        {
            "type": "actions",
            "elements": [
                {
                    "type": "button",
                    "text": {
                        "type": "plain_text",
                        "text": "View Dashboard",
                        "emoji": True
                    },
                    "url": "https://invest-board-seven.vercel.app/",
                    "style": "primary"
                }
            ]
        }
    ]
}

try:
    response = requests.post(slack_url, json=payload, timeout=30)
    print(f"Slack Response: {response.status_code}")
    print(f"Slack Body: {response.text}")
    if response.status_code == 200:
        print("=== SUCCESS: Message sent to Slack ===")
    else:
        print(f"ERROR: Slack returned {response.status_code}")
        sys.exit(1)
except Exception as e:
    print(f"ERROR: Slack request failed: {e}")
    sys.exit(1)
PYTHON_SCRIPT
