name: Daily Slack Dashboard Report

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Test Slack Connection
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "Testing Slack connection..."
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "ERROR: SLACK_WEBHOOK_URL not set"
            exit 1
          fi

          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"text":"GitHub Actions test message - Slack connection works!"}' \
            && echo "Slack message sent successfully!" \
            || echo "Failed to send Slack message"
