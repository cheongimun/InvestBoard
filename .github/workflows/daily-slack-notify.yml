name: Daily Slack Dashboard Report

on:
  schedule:
    # 매일 UTC 23:00 = 한국시간 08:00
    - cron: '0 23 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-slack-notify.yml'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests psycopg2-binary

      - name: Sync Dashboard and Send Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: python scripts/slack_report.py
