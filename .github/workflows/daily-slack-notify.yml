name: Daily Slack Dashboard Report

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Restore previous data cache
        uses: actions/cache@v4
        with:
          path: scripts/previous_data.json
          key: kpi-data-${{ github.run_number }}
          restore-keys: |
            kpi-data-

      - name: Sync Dashboard and Send Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/slack_report.py
